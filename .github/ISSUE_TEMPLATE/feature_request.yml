name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 `docs/requirements.md` 的「明确不做」清单——索引服务、内置编辑器、
        插件系统、AI 分类等功能是有意排除的，不是遗漏。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 描述场景，不要直接给方案。例如"整理 3000 张照片时无法按拍摄地筛选"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解决方式
    validations:
      required: true

  - type: dropdown
    id: cost
    attributes:
      label: 这个功能会影响"启动快"吗？
      options:
        - 不影响（纯 UI / 纯字符串处理）
        - 可能有影响（需要读磁盘、开数据库、调 Shell）
        - 不确定
    validations:
      required: true
