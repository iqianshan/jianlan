name: Bug 报告
description: 报告崩溃、卡顿、显示异常或功能不符预期
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认：程序版本、Windows 版本、问题是否能稳定复现。
        如果是"启动慢"或"滚动卡"，请附上下面的启动日志。

  - type: input
    id: version
    attributes:
      label: Jianlan 版本
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 (22631.4169)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 D:\Docs
        2. 切换到双窗格
        3. 右键……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: |
        `%LOCALAPPDATA%\Jianlan\logs\` 下的 app.log 与 crash.log。
        提交前请删掉路径中的个人信息。
      render: text
    validations:
      required: false
