name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

  # 启动性能门禁。判定逻辑见 docs/performance-gate.md §8.2
  # 相对 baseline.json 比较，超 2.5 倍即失败——只拦数量级退化（如启动期加了同步 IO）。
  # 渐进式退化由发布前的本地测量负责（容差 1.2 倍）。
  perf-gate:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish (Release + ReadyToRun)
        run: dotnet publish src/Lingpane.App -c Release -r win-x64 --self-contained false -o publish

      - name: Startup gate
        shell: pwsh
        run: |
          $exe = "publish\Lingpane.exe"
          if (-not (Test-Path $exe)) { throw "未找到构建产物：$exe" }

          & pwsh -NoProfile -File ./tools/startup-bench/Measure-Startup.ps1 -Exe $exe -Runs 3 -BaselinePath baseline.json -ToleranceFactor 2.5
          $code = $LASTEXITCODE

          if ($code -eq 4) {
            # runner 为 Session 0，无法保证窗口渲染，此时不判定性能
            Write-Host "::warning::启动埋点未生成（runner 环境不支持 GUI 渲染），本次跳过性能判定"
            exit 0
          }
          if ($code -ne 0) {
            Write-Host "::error::启动耗时超出基线 2.5 倍，可能引入了启动期同步 IO 或大资源加载"
            exit $code
          }
